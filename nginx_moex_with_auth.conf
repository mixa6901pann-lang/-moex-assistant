# MOEX Assistant reverse proxy for invest-assistant.ru
# HTTP Basic Auth protects the entire site and API.
# Existing API key rules for write endpoints are preserved.
# IMPORTANT: replace YOUR_API_KEY_HERE with the value from /root/moex-app/.env (API_KEY).

map $http_x_api_key$arg_api_key $api_auth {
    default 0;
    "YOUR_API_KEY_HERE" 1;
}

map $request_method$api_auth $api_block {
    default 1;
    "GET1" 0;
    "GET0" 0;
    "HEAD1" 0;
    "HEAD0" 0;
    "OPTIONS1" 0;
    "OPTIONS0" 0;
    "POST1" 0;
    "PUT1" 0;
    "PATCH1" 0;
    "DELETE1" 0;
}

server {
    listen 443 ssl;
    server_name invest-assistant.ru www.invest-assistant.ru;

    ssl_certificate /etc/letsencrypt/live/invest-assistant.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/invest-assistant.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Global password protection
    auth_basic "MOEX Assistant Private";
    auth_basic_user_file /etc/nginx/.htpasswd-moex;

    # Allow Let's Encrypt challenges without auth
    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Sentiment analysis endpoint: inject API key automatically
    location ~ ^/api/ticker/[^/]+/sentiment$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key "YOUR_API_KEY_HERE";
        proxy_read_timeout 300s;
    }

    location /api/ {
        if ($api_block = 1) {
            return 401 "Unauthorized: missing or invalid API key\n";
        }

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    server_name invest-assistant.ru www.invest-assistant.ru;
    return 301 https://$host$request_uri;
}
