server {
    listen 80;
    server_name chasy-master.ru www.chasy-master.ru;

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name chasy-master.ru www.chasy-master.ru;

    root /var/www/chasy-master.ru;
    index index.html;

    # SSL certificates (Certbot will create these)
    ssl_certificate /etc/letsencrypt/live/chasy-master.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chasy-master.ru/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Static files
    location / {
        try_files $uri $uri/ =404;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|mp4|woff|woff2)$ {
        expires 1M;
        add_header Cache-Control "public, immutable";
    }
}
